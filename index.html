<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="card">
  <h2>Add Product ✨</h2>
  <p>Upload a new product to your store</p>

  <label>Product Image</label>
  <input type="file" id="image" accept="image/*">
  <img id="preview">
  <div id="debug">No file chosen yet</div>

  <label>Product Name</label>
  <input type="text" id="name" placeholder="e.g. cloth">

  <label>Product Price (₦)</label>
  <input type="number" id="productprice" placeholder="e.g. 15000">

  <label>Category</label>
  <select id="category">
    <option>Men</option>
    <option>Women</option>
    <option>Home</option>
    <option>Beauty</option>
    <option>Electronics</option>
    <option>Jewelry</option>
    <option>Fashion</option>
  </select>

  <button class="btn" onclick="addProduct()">Upload Product</button>
  <div id="message"></div>
  <a href="pro.html" style="display:block;text-align:center;margin-top:15px;">View Website →</a>
</div>
<script src="admin.js"></script>
</body>
</html>
